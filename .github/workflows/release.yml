name: release

# Build a universal, signed + notarized Coo.app and publish a .dmg to a
# GitHub Release whenever a v* tag is pushed:
#   (bump [workspace.package] version in Cargo.toml) && git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Developer ID signing + notarization, driven by repo secrets (same names
      # as Kompass). Without them the job builds an ad-hoc-signed app.
      #   MACOS_CERT_P12        base64 of the "Developer ID Application" .p12
      #   MACOS_CERT_PASSWORD   password for that .p12
      #   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_P8
      #                         App Store Connect API key (raw .p8 contents)
      - name: Import signing certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$API_KEY_P8" ]; then
            # A public release must be signed + notarized: an unsigned build
            # is blocked by Gatekeeper and Sparkle won't install it.
            echo "::error::Signing secrets missing or empty (MACOS_CERT_P12, MACOS_CERT_PASSWORD, APPLE_API_KEY_P8): refusing to publish an unsigned release."
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application" \
            || { echo "::error::The .p12 in MACOS_CERT_P12 has no Developer ID Application identity."; exit 1; }
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "PIGEON_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$API_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Signed with Developer ID + notarized." >> "$GITHUB_STEP_SUMMARY"

      # OAuth client ids and the Sentry DSN are compiled in (option_env!), so
      # the released app works without any environment setup.
      - name: Build universal app bundle
        env:
          PIGEON_MS_CLIENT_ID: ${{ secrets.PIGEON_MS_CLIENT_ID }}
          PIGEON_GOOGLE_CLIENT_ID: ${{ secrets.PIGEON_GOOGLE_CLIENT_ID }}
          PIGEON_GOOGLE_CLIENT_SECRET: ${{ secrets.PIGEON_GOOGLE_CLIENT_SECRET }}
          PIGEON_SENTRY_DSN: ${{ secrets.PIGEON_SENTRY_DSN }}
          PIGEON_ZOOM_CLIENT_ID: ${{ secrets.PIGEON_ZOOM_CLIENT_ID }}
          PIGEON_GOOGLE_API_KEY: ${{ secrets.PIGEON_GOOGLE_API_KEY }}
          PROVISION_PROFILE_B64: ${{ secrets.PIGEON_PROVISION_PROFILE_B64 }}
        run: |
          for v in PIGEON_MS_CLIENT_ID PIGEON_GOOGLE_CLIENT_ID PIGEON_GOOGLE_CLIENT_SECRET; do
            [ -n "${!v}" ] || echo "::warning::$v is not set; sign-in for that provider won't work in this build"
          done
          # Developer ID profile: enables Time Sensitive meeting reminders.
          # Only with real signing (the entitlement is restricted).
          if [ -n "$PROVISION_PROFILE_B64" ] && [ "${{ steps.sign.outputs.enabled }}" = "true" ]; then
            printf '%s' "$PROVISION_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/Coo.provisionprofile"
            export PIGEON_PROVISION_PROFILE="$RUNNER_TEMP/Coo.provisionprofile"
          fi
          # Sparkle compares CFBundleVersion: the commit count only grows.
          export COO_BUILD_NUMBER="$(git rev-list --count HEAD)"
          ./scripts/bundle.sh --universal

      # Crash reports come from a stripped binary: upload each arch's dSYM
      # (split-debuginfo, Cargo.toml) so Sentry can name the code. Matched by
      # debug id, so no release name is needed. Skipped without a token.
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: tv-tracker
          SENTRY_PROJECT: pigeon
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set; crash reports from this build won't be symbolicated"
            exit 0
          fi
          dsyms=$(find target -maxdepth 4 -type d -name '*.dSYM' -path '*-apple-darwin/release/*')
          [ -n "$dsyms" ] || { echo "::error::no dSYM found"; exit 1; }
          echo "$dsyms"
          brew install getsentry/tools/sentry-cli >/dev/null
          sentry-cli debug-files upload --wait $dsyms

      # Notarize + staple the app itself so it passes Gatekeeper offline and
      # when Homebrew copies it out of the dmg.
      - name: Notarize app
        if: steps.sign.outputs.enabled == 'true'
        run: ./scripts/notarize.sh dist/Coo.app

      - name: Package .dmg
        id: dmg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE="$(mktemp -d)"
          cp -R dist/Coo.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="Coo-${VER}.dmg"
          # hdiutil intermittently fails with "Resource busy" on GitHub's macOS
          # runners; retry.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Coo" -srcfolder "$STAGE" -ov -format UDZO "$DMG" && break
            [ "$i" = 5 ] && exit 1
            echo "hdiutil create failed (attempt $i), retrying…"; sleep $((i * 5))
          done
          if [ "${{ steps.sign.outputs.enabled }}" = "true" ]; then
            codesign --force --timestamp --sign "$PIGEON_SIGN_IDENTITY" "$DMG"
            ./scripts/notarize.sh "$DMG"
          fi
          # Hash only after stapling: stapling writes the ticket into the dmg.
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$DMG" > "$DMG.sha256"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "### Coo $VER" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # Sparkle feed: one item for this release, EdDSA-signed dmg. Published as
      # a release asset, so .../releases/latest/download/appcast.xml always
      # names the newest version.
      - name: Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          DMG="${{ steps.dmg.outputs.dmg }}"
          VER="${{ steps.dmg.outputs.ver }}"
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY not set: no appcast, apps won't see this update"
            exit 0
          fi
          SPARKLE="$(./scripts/fetch-sparkle.sh)"
          KEY="$RUNNER_TEMP/sparkle_ed.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY"
          ATTRS="$("$SPARKLE/bin/sign_update" --ed-key-file "$KEY" "$DMG")"
          rm -f "$KEY"
          BUILD="$(plutil -extract CFBundleVersion raw dist/Coo.app/Contents/Info.plist)"
          MIN_OS="$(plutil -extract LSMinimumSystemVersion raw dist/Coo.app/Contents/Info.plist)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${DMG}"
          PAGE="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          # Inline notes (Sparkle renders them in its dialog): the hand-written
          # release-notes/<tag>.md if present, else this release's commit titles.
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          git log --no-merges --pretty='%s' ${PREV:+"$PREV.."}"$GITHUB_REF_NAME" \
            | python3 scripts/release-notes-html.py "$VER" > notes.html
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Coo</title>
              <item>
                <title>Coo ${VER}</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VER}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${MIN_OS}</sparkle:minimumSystemVersion>
                <description><![CDATA[$(cat notes.html)]]></description>
                <sparkle:fullReleaseNotesLink>${PAGE}</sparkle:fullReleaseNotesLink>
                <enclosure url="${URL}" type="application/octet-stream" ${ATTRS} />
              </item>
            </channel>
          </rss>
          EOF
          echo "appcast: build $BUILD" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="${{ steps.dmg.outputs.dmg }}"
          SHA="${{ steps.dmg.outputs.sha }}"
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --no-merges --pretty='- %s' "$PREV..$GITHUB_REF_NAME")"
            RANGE="since $PREV"
          else
            CHANGES="$(git log --no-merges --pretty='- %s' "$GITHUB_REF_NAME")"
            RANGE="initial"
          fi
          {
            echo "## What's changed ($RANGE)"
            echo
            echo "$CHANGES"
            echo
          } > notes.md
          cat >> notes.md <<EOF
          Universal macOS build (Apple Silicon + Intel).

          ### Install
          \`\`\`sh
          brew install --cask erango/tap/coo
          \`\`\`
          Or download \`$DMG\` below and drag Coo to Applications.

          \`sha256: $SHA\`
          EOF
          if [ "${{ steps.sign.outputs.enabled }}" != "true" ]; then
            cat >> notes.md <<EOF

          **Unsigned build:** on first launch, right-click the app → **Open**, or run
          \`xattr -dr com.apple.quarantine /Applications/Coo.app\`.
          EOF
          fi
          ASSETS=("$DMG" "$DMG.sha256")
          [ -f appcast.xml ] && ASSETS+=(appcast.xml)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --title "Coo $GITHUB_REF_NAME" \
            --notes-file notes.md

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VER: ${{ steps.dmg.outputs.ver }}
          SHA: ${{ steps.dmg.outputs.sha }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set: skipping tap bump." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/erango/homebrew-tap.git" tap
          cd tap
          if [ ! -f Casks/coo.rb ]; then
            echo "Casks/coo.rb missing in erango/homebrew-tap: skipping bump." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sed -i '' -E "s/version \".*\"/version \"$VER\"/; s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/coo.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "coo $VER"
          git push
          echo "Bumped erango/homebrew-tap to $VER." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain
        if: always() && steps.sign.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
