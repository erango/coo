[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
pigeon-core = { path = "crates/pigeon-core" }
pigeon-graph = { path = "crates/pigeon-graph" }
pigeon-google = { path = "crates/pigeon-google" }
pigeon-engine = { path = "crates/pigeon-engine" }

ammonia = "4.2"
base64 = "0.23"
chrono-tz = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
encoding_rs = "0.8"
futures = "0.3.34"
getrandom = "0.4"
mail-builder = "1.0"
open = "5.4"
reqwest = { version = "0.13.5", features = ["json", "form", "query", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
security-framework = "3.7"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: edits to other tools' JSON configs (~/.claude.json) keep their key order.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5"
