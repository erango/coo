<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Pigeon icon sprite. 24-unit grid, 1.6 stroke, round caps and joins.
    Stroke icons inherit currentColor; size them with .icon (CSS width/height).
    Usage: <svg class="icon"><use href="#i-archive"/></svg>
