[package]
name = "pigeon-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pigeon-app"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
dioxus = { version = "0.7.9", features = ["desktop"] }
open.workspace = true
pigeon-core.workspace = true
pigeon-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
