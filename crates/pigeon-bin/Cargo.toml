[package]
name = "pigeon-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pigeon-app"
path = "src/main.rs"

[dependencies]
base64.workspace = true
chrono.workspace = true
dioxus = { version = "0.7.9", features = ["desktop"] }
open.workspace = true
pigeon-core.workspace = true
pigeon-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSDockTile", "NSRunningApplication", "NSSound", "NSPopover", "NSViewController", "NSView", "NSStackView", "NSTextField", "NSControl", "NSButton", "NSFont", "NSColor", "NSWindow", "NSLayoutConstraint", "NSUserInterfaceLayout", "NSText", "NSGraphics", "NSScreen", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSDictionary", "NSSet", "NSArray", "NSBundle", "NSError", "NSObject", "NSCalendar", "NSDate", "NSGeometry", "objc2-core-foundation"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"
